\n\n/usr/libexec/PlistBuddy \\\n-c \"Add :BuildVersion string $BUILD_VERSION\" \\\n\"$PLIST_PATH\" 2>/dev/null || \\\n/usr/libexec/PlistBuddy \\\n-c \"Set :BuildVersion $BUILD_VERSION\" \\\n\"$PLIST_PATH\"\n\n\n/usr/libexec/PlistBuddy \\\n-c \"Add :BuildNumber string $BUILD_NUMBER\" \\\n\"$PLIST_PATH\" 2>/dev/null || \\\n/usr/libexec/PlistBuddy \\\n-c \"Set :BuildNumber $BUILD_NUMBER\" \\\n\"$PLIST_PATH\"\n\n\n# ==========================================\n# 8. Add IxGuard Information\n# ==========================================\n\n\n/usr/libexec/PlistBuddy \\\n-c \"Add :IxGuardUsed bool $IS_IXGUARD_USED\" \\\n\"$PLIST_PATH\" 2>/dev/null || \\\n/usr/libexec/PlistBuddy \\\n-c \"Set :IxGuardUsed $IS_IXGUARD_USED\" \\\n\"$PLIST_PATH\"\n\n\necho \"Git, build and IxGuard information added to Info.plist\"\n";
